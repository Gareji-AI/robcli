name: Release assets

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload archives to an existing GitHub Release
        type: boolean
        default: false
      tag:
        description: Existing tag, for example v0.7.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.target_os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            arch: x86_64
            binary: rob.exe
          - os: ubuntu-latest
            target_os: linux
            arch: x86_64
            binary: rob
          - os: macos-latest
            target_os: macos
            arch: aarch64
            binary: rob
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build --release --locked

      - name: Offline smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/${{ matrix.binary }}"
          "$bin" --version
          "$bin" schema >/dev/null
          "$bin" users link --user 1 >/dev/null

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          python scripts/package-release.py \
            --version "$version" \
            --os "${{ matrix.target_os }}" \
            --arch "${{ matrix.arch }}" \
            --binary "target/release/${{ matrix.binary }}" \
            --licenses . \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: robcli-${{ matrix.target_os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload existing release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Require the existing tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${{ inputs.tag }}" = "v${version}"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}"
          gh release upload "${{ inputs.tag }}" dist/* --repo "${{ github.repository }}"
