[package]
name = "robcli"
version = "0.8.1"
edition = "2024"
rust-version = "1.99"
publish = ["crates-io"]
description = "Roblox Dashboard and public games, profiles, communities and catalogs with bounded reads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eiei114/robcli"
readme = "readme.md"
authors = ["eiei114"]
keywords = ["roblox", "cli", "dashboard", "creator-store", "agents"]
categories = ["command-line-utilities", "development-tools"]
# Publish reviewed source/docs only, never local traffic state, credentials or captures.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "readme.md",
    "license-mit",
    "license-apache",
    "changelog.md",
    "assets/icon.png",
    "src/**",
    "tests/**",
    "docs/**",
]

[[bin]]
name = "rob"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
